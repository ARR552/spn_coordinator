[workspace]
members = [
    ".",
    "crates/types/rpc"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/succinctlabs/sp1"
keywords = ["sp1", "succinct", "zero-knowledge", "zkvm"]
categories = ["cryptography"]

[package]
name = "spn_coordinator"
default-run = "spn_coordinator"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[[bin]]
name = "spn_coordinator"
path = "src/bin/main.rs"

[[bin]]
name = "http_test"
path = "src/bin/http_test.rs"

[dependencies]
logger = { path = "crates/logger" }
rpc-types = { path = "crates/types/rpc" }
tokio = { workspace = true }
anyhow = { workspace = true }
tonic = { workspace = true }
tonic-reflection = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
tokio-stream = "0.1"
rand = "0.9.2"
chrono.workspace = true
ethers-core = "2.0.14"
eyre = "0.6.12"
alloy.workspace = true
prost.workspace = true
tracing = "0.1.41"
ethers = "2.0.14"
axum = "0.8"
tower = "0.5"
bytes = "1.10"
reqwest = { workspace = true }
rustls = "0.23.31"
bincode = "1.3.3"
clap = { version = "4.5.47", features = ["derive"] }
serde.workspace = true
directories = "6.0.0"
config = "0.15.15"
rocksdb = "0.24.0"

[workspace.dependencies]
rpc = { path = "crates/types/rpc" }
tokio = { version = "1.47.1", features = ["full"] }
anyhow = "1.0.99"
http = "1.3.1"
hex = "0.4"
chrono = "0.4.42"
reqwest = { version = "0.12.23", features = ["json"] }
prost-types = "0.14.1"
prost-build = "0.14.1"
prost = "0.14.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
alloy-signer-local = "1.0.30"
alloy-signer = "1.0.30"
alloy-primitives = { version = "1.3.1", features = ["k256"] }
alloy-sol-types = "1.3.1"
alloy-json-rpc = "1.0.30"
alloy = { version = "1.0.30", features = [
    "reqwest",
    "network",
    "providers",
    "sol-types",
    "rpc-types",
] }
alloy-provider = { version = "1.0.30", default-features = false, features = [
    "reqwest",
    "reqwest-rustls-tls",
] }
alloy-rpc-types = { version = "1.0.30", default-features = false, features = [
    "eth",
] }
alloy-rpc-client = { version = "1.0.30", default-features = false }
alloy-transport = { version = "1.0.30", default-features = false }
alloy-network = { version = "1.0.30", default-features = false }
alloy-rlp = { version = "0.3.12", default-features = false }
thiserror = "2.0.16"
tonic = { version = "0.14.2", features = ["transport", "gzip", "tls-ring", "tls-native-roots"] }
tonic-reflection = "0.14.2"
tonic-prost-build = "0.14.2"
tonic-prost = "0.14.2"
bytes = "1"
async-trait = "0.1.89"
