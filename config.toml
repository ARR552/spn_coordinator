# Logging
log_level = "info" # If it is not set, the spn_coordinator loads the ENV (RUST_LOG=info by default)

# Artifact settings
artifact_base_url = "http://spn-coordinator-001:8082"

# Server settings
[server]
grpc_addr = "0.0.0.0"
grpc_port = 50051
grpc_tls = false
http_addr = "0.0.0.0"
http_port = 8082
db_path = "./db/"
    [server.checker]
    proof_reassign_timeout = 0
    checker_interval = 30

